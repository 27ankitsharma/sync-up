<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-label="Agent architecture loop">
  <rect width="840" height="280" fill="#fbfaff"/>
  <rect x="24" y="88" width="140" height="72" rx="12" fill="#7c3aed" />
  <text x="94" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">Goal</text>
  <rect x="196" y="88" width="140" height="72" rx="12" fill="#6d28d9" />
  <text x="266" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">Policy</text>
  <rect x="368" y="88" width="140" height="72" rx="12" fill="#5b21b6" />
  <text x="438" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">Tools</text>
  <rect x="540" y="88" width="140" height="72" rx="12" fill="#4c1d95" />
  <text x="610" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16">State</text>
  <rect x="712" y="88" width="104" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" />
  <text x="764" y="130" text-anchor="middle" fill="#5b21b6" font-family="Arial, sans-serif" font-size="16">Stop</text>
  <text x="420" y="40" text-anchor="middle" fill="#1e1b4b" font-family="Arial, sans-serif" font-size="18">Agent loop: observe → decide → act → update</text>
  <path d="M164 124 H196" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M336 124 H368" stroke="#7c3aed" stroke-width="3"/>
  <path d="M508 124 H540" stroke="#7c3aed" stroke-width="3"/>
  <path d="M680 124 H712" stroke="#7c3aed" stroke-width="3"/>
  <path d="M764 160 V210 H94 V160" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <text x="420" y="250" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="13">Observations return to state until the stop condition is met</text>
</svg>
